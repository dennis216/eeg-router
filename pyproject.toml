[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b-false-alarm-atlas"
version = "0.1.0"
description = "Leakage-safe false-alarm phenotype atlas for CHB-MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mne",
  "numpy",
  "omegaconf",
  "pandas",
  "pyarrow",
  "pydantic>=2",
  "pyyaml",
  "scikit-learn",
  "scipy",
  "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
